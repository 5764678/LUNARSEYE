[project]
name = "lunareyes-api"
version = "0.2.0"
description = "LUNAREYES Round 2 HTTP API (FastAPI) over the frozen lunareyes-science and lunareyes-data."
requires-python = ">=3.11"
dependencies = [
  "lunareyes-science",
  "lunareyes-data",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2",
]

[tool.uv.sources]
lunareyes-science = { workspace = true }
lunareyes-data = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lunareyes_api"]
