[project]
name = "lunaris-api"
version = "0.2.0"
description = "LUNARIS Round 2 HTTP API (FastAPI) over the frozen lunaris-science and lunaris-data."
requires-python = ">=3.11"
dependencies = [
  "lunaris-science",
  "lunaris-data",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2",
]

[tool.uv.sources]
lunaris-science = { workspace = true }
lunaris-data = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lunaris_api"]
