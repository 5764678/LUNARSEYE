# Phase 1: Postgres only. The API and web app run from the checkout (see README).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: lunareyes
      POSTGRES_PASSWORD: lunareyes
      POSTGRES_DB: lunareyes
    ports:
      - "5432:5432"
    volumes:
      - lunareyes-pg:/var/lib/postgresql/data
volumes:
  lunareyes-pg:
