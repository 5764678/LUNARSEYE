# LUNAREYES Round 2 — Python workspace root (not a distributable package).
#   uv sync && uv run pytest
[project]
name = "lunareyes-workspace"
version = "0.2.0"
description = "LUNAREYES Round 2 monorepo Python workspace root."
requires-python = ">=3.11"
dependencies = ["lunareyes-science", "lunareyes-data", "lunareyes-api"]

[dependency-groups]
dev = ["pytest>=8.3", "hypothesis>=6.120", "ruff>=0.8", "httpx2>=2.16"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/science", "packages/data", "apps/api"]

[tool.uv.sources]
lunareyes-science = { workspace = true }
lunareyes-data = { workspace = true }
lunareyes-api = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
filterwarnings = [
  "error",
  "ignore::rasterio.errors.NotGeoreferencedWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
