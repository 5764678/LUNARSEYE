[project]
name = "lunareyes-data"
version = "0.1.0"
description = "LUNAREYES data layer: dataset manifests with provenance, reproducible acquisition, integrity verification and preprocessing of NASA lunar products."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "UNLICENSED" }
dependencies = [
  "lunareyes-science",
  "pydantic>=2.9",
  "httpx>=0.28",
  "rasterio>=1.4.2",
  "numpy>=2.1",
]

[project.scripts]
lunareyes-data = "lunareyes_data.cli:main"

[tool.uv.sources]
lunareyes-science = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lunareyes_data"]
