# Render blueprint: one Docker web service (API + web in one container) and a Postgres.
# New > Blueprint > pick this repo. The image build downloads ≈ 87 MB of NASA/NAIF/PDS data
# and pre-computes the horizon caches; allow roughly 10 minutes for the first build.
databases:
  - name: lunarseye-db
    databaseName: lunaris
    user: lunaris
    postgresMajorVersion: "16"   # the version the app was tested against
    plan: free            # Render's free Postgres expires after 30 days; fine for the hackathon

services:
  - type: web
    name: lunarseye
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free            # see docs/round2/DEPLOY.md: measured memory vs the plan's limit
    healthCheckPath: /api/health
    envVars:
      - key: LUNARIS_DATABASE_URL
        fromDatabase:
          name: lunarseye-db
          property: connectionString
